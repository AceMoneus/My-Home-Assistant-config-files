          and is_state('binary_sensor.ha_kottbo_healthy', 'on')
          and is_state('binary_sensor.openobserve_healthy', 'on')
          and is_state('binary_sensor.postgresql_healthy', 'on')
          and is_state('binary_sensor.remote_healthy', 'on')
          and is_state('binary_sensor.vector_healthy', 'on')
        }}

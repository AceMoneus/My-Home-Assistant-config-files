- binary_sensor:

    #################################################################
    # PMX-11
    #################################################################

    - name: PMX-11 Healthy
      unique_id: pmx11_healthy
      state: >
        {{
          is_state('binary_sensor.pmx_11_online', 'on')
          and states('sensor.pmx_11_cpu')|float(0) < 80
          and states('sensor.pmx_11_memory')|float(0) < 80
          and states('sensor.pmx_11_disk')|float(0) < 80
          and states('sensor.pmx_11_cpu_temp')|float(0) < 80
        }}

    #################################################################
    # PMX-12
    #################################################################


- triggers:
    - trigger: time_pattern
      minutes: "/5"
  sensor:
    - name: influx_export_health
      unique_id: influx_export_health
      unit_of_measurement: stale
      icon: mdi:database-eye
      state: |
        {% set sources = [{"tag":"temperature_inhouse","source":"sensor.mt71_temperatur","max_age_min":180},{"tag":"humidity_inhouse","source":"sensor.mt71_luftfuktighet","max_age_min":180},{"tag":"temperature_outside","source":"sensor.mt72_temperatur","max_age_min":180},{"tag":"humidity_outside","source":"sensor.mt72_luftfuktighet","max_age_min":180},{"tag":"basement_temperature","source":"sensor.mt73_temperatur","max_age_min":180},{"tag":"basement_humidity","source":"sensor.mt73_luftfuktighet","max_age_min":180},{"tag":"bedroom_temperature","source":"sensor.mt74_temperatur","max_age_min":180},{"tag":"bedroom_humidity","source":"sensor.mt74_luftfuktighet","max_age_min":180},{"tag":"total_power","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":30},{"tag":"power_l1","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":30},{"tag":"power_l2","source":"sensor.slimmelezer_voltage_phase_2","max_age_min":30},{"tag":"power_l3","source":"sensor.slimmelezer_voltage_phase_3","max_age_min":30},{"tag":"energy_imported","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":60}] %}{% set ns = namespace(n=0) %}{% for m in sources %}{% set st = states(m.source) %}{% set lu = states[m.source].last_updated if states[m.source] is defined else none %}{% set age = (as_timestamp(now()) - as_timestamp(lu)) / 60 if lu else 99999 %}{% if not (st not in ['unknown', 'unavailable', 'none', ''] and age <= m.max_age_min) %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}{{ ns.n }}
      attributes:
        stale: |
          {% set sources = [{"tag":"temperature_inhouse","source":"sensor.mt71_temperatur","max_age_min":180},{"tag":"humidity_inhouse","source":"sensor.mt71_luftfuktighet","max_age_min":180},{"tag":"temperature_outside","source":"sensor.mt72_temperatur","max_age_min":180},{"tag":"humidity_outside","source":"sensor.mt72_luftfuktighet","max_age_min":180},{"tag":"basement_temperature","source":"sensor.mt73_temperatur","max_age_min":180},{"tag":"basement_humidity","source":"sensor.mt73_luftfuktighet","max_age_min":180},{"tag":"bedroom_temperature","source":"sensor.mt74_temperatur","max_age_min":180},{"tag":"bedroom_humidity","source":"sensor.mt74_luftfuktighet","max_age_min":180},{"tag":"total_power","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":30},{"tag":"power_l1","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":30},{"tag":"power_l2","source":"sensor.slimmelezer_voltage_phase_2","max_age_min":30},{"tag":"power_l3","source":"sensor.slimmelezer_voltage_phase_3","max_age_min":30},{"tag":"energy_imported","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":60}] %}{% set ns = namespace(stale=[]) %}{% for m in sources %}{% set st = states(m.source) %}{% set lu = states[m.source].last_updated if states[m.source] is defined else none %}{% set age = (as_timestamp(now()) - as_timestamp(lu)) / 60 if lu else 99999 %}{% if not (st not in ['unknown', 'unavailable', 'none', ''] and age <= m.max_age_min) %}{% set ns.stale = ns.stale + [m.tag] %}{% endif %}{% endfor %}{{ ns.stale }}
        ok_count: |
          {% set sources = [{"tag":"temperature_inhouse","source":"sensor.mt71_temperatur","max_age_min":180},{"tag":"humidity_inhouse","source":"sensor.mt71_luftfuktighet","max_age_min":180},{"tag":"temperature_outside","source":"sensor.mt72_temperatur","max_age_min":180},{"tag":"humidity_outside","source":"sensor.mt72_luftfuktighet","max_age_min":180},{"tag":"basement_temperature","source":"sensor.mt73_temperatur","max_age_min":180},{"tag":"basement_humidity","source":"sensor.mt73_luftfuktighet","max_age_min":180},{"tag":"bedroom_temperature","source":"sensor.mt74_temperatur","max_age_min":180},{"tag":"bedroom_humidity","source":"sensor.mt74_luftfuktighet","max_age_min":180},{"tag":"total_power","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":30},{"tag":"power_l1","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":30},{"tag":"power_l2","source":"sensor.slimmelezer_voltage_phase_2","max_age_min":30},{"tag":"power_l3","source":"sensor.slimmelezer_voltage_phase_3","max_age_min":30},{"tag":"energy_imported","source":"sensor.slimmelezer_voltage_phase_1","max_age_min":60}] %}{% set ns = namespace(n=0) %}{% for m in sources %}{% set st = states(m.source) %}{% set lu = states[m.source].last_updated if states[m.source] is defined else none %}{% set age = (as_timestamp(now()) - as_timestamp(lu)) / 60 if lu else 99999 %}{% if st not in ['unknown', 'unavailable', 'none', ''] and age <= m.max_age_min %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}{{ ns.n }}
        checked_at: "{{ now().isoformat() }}"

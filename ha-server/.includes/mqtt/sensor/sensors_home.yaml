- name: "Timestamp kottbo"
  state_topic: "timestamp/ha-kottbo"
  device_class: "timestamp"
  value_template: "{{ as_datetime(value) }}"
  unique_id: "mqtt_timestamp_ha_kottbo"
  default_entity_id: sensor.mqtt_kottbo_timestamp
  qos: 2


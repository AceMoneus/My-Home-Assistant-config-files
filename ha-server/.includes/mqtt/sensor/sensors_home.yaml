# home — climate (Matter bridge; publish automations feed these topics)
- name: "Temperatur inne"
  unique_id: mqtt_temperatur_inne
  default_entity_id: sensor.mqtt_home_temp_inhouse
  state_topic: home/temp/inhouse
  unit_of_measurement: "°C"
  device_class: temperature
  state_class: measurement
  value_template: "{{ value }}"
- name: "Luftfuktighet inne"
  unique_id: mqtt_luftfuktighet_inne
  default_entity_id: sensor.mqtt_home_humid_inhouse
  state_topic: home/humid/inhouse
  unit_of_measurement: "%"
  device_class: humidity
  state_class: measurement
  value_template: "{{ value }}"
- name: "Temperatur ute"
  unique_id: mqtt_temperatur_ute

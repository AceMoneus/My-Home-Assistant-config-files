  unit_of_measurement: "%"
  device_class: humidity
  state_class: measurement
  value_template: "{{ value }}"
- name: "Temperatur sovrum"
  unique_id: mqtt_temperatur_sovrum
  default_entity_id: sensor.mqtt_home_temp_bedroom

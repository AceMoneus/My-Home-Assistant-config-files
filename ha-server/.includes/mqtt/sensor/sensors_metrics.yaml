# HA Server
- name: "MQTT HA Server CPU"
  unique_id: mqtt_ha_server_cpu
  state_topic: metrics/ha-server
  unit_of_measurement: "%"
  state_class: measurement
  value_template: "{{ value_json.cpu | default(0) }}"

- name: "MQTT HA Server Memory"
  unique_id: mqtt_ha_server_memory
  state_topic: metrics/ha-server
  unit_of_measurement: "%"
  state_class: measurement
  value_template: "{{ value_json.memory | default(0) }}"

- name: "MQTT HA Server Disk"
  unique_id: mqtt_ha_server_disk
  state_topic: metrics/ha-server
  unit_of_measurement: "%"
  state_class: measurement
  value_template: "{{ value_json.disk | default(0) }}"


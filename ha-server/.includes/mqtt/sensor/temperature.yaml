# Matter climate bridge — HA subscribes; publish automations feed these topics
- name: "MQTT Temperatur Inne"
  unique_id: mqtt_temperatur_inne
  state_topic: home/temp/inhouse
  unit_of_measurement: "°C"
  device_class: temperature
  state_class: measurement
  value_template: "{{ value }}"
- name: "MQTT Luftfuktighet Inne"
  unique_id: mqtt_luftfuktighet_inne
  state_topic: home/humid/inhouse
  unit_of_measurement: "%"
  device_class: humidity
  state_class: measurement
  value_template: "{{ value }}"

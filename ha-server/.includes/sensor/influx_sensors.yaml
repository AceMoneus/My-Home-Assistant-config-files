# Influx hourly export — rolling 1 h statistics (standalone helpers, not on devices)
- platform: statistics
  name: influx_stats_temperature_inhouse
  unique_id: influx_stats_temperature_inhouse
  entity_id: sensor.mt71_temperatur
  state_characteristic: mean
  max_age:
    hours: 1
  precision: 1

- platform: statistics
  name: influx_stats_humidity_inhouse
  unique_id: influx_stats_humidity_inhouse
  entity_id: sensor.mt71_luftfuktighet
  state_characteristic: mean
  max_age:
    hours: 1
  precision: 0


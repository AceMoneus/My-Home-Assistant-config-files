- id: '1749557595493'
  alias: Update Binary Sensor "dark" every minute
  description: ''
  triggers:
  - minutes: /1
    trigger: time_pattern
  conditions: []
  actions:
  - variables:
      sun_elevation: '{{ state_attr(''sun.sun'', ''elevation'') }}'
  - data:
      topic: home/state/dark
      payload: '{{ ''ON'' if sun_elevation <= 1.5 else ''OFF'' }}'
      retain: false
    action: mqtt.publish
    continue_on_error: true
  mode: single
  max_exceeded: silent

- id: '1783629183654'
  alias: Uppdatera Home Away och Alarm State baserat på mobiler
  description: 'Styrs via person.kjell/person.bettan (UniFi-trackers under Personer).
    Publicerar home/state/home_away med retain. Bootstrap vid start och var 5:e minut.
    Larm styrs bara vid närvarobyte.

    '
  triggers:
  - trigger: state
    id: presence
    entity_id:
    - person.kjell
    - person.bettan
    to: home
  - trigger: state
    id: presence
    entity_id:
    - person.kjell
    - person.bettan
    for:
      minutes: 2
    to: not_home
  - trigger: homeassistant
    id: bootstrap
    event: start
  - trigger: time_pattern
    id: bootstrap
    minutes: /5
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: person.kjell
          state: home
        - condition: state
          entity_id: person.bettan
          state: home
      sequence:
      - action: mqtt.publish
        data:
          topic: home/state/home_away
          payload: home
          retain: true
          qos: 2
        continue_on_error: true
      - if:
        - condition: trigger
          id: presence
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.mqtt_home_alarm_state
          continue_on_error: true
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: person.kjell
          state: not_home
        - condition: state
          entity_id: person.bettan
          state: not_home
      - condition: or
        conditions:
        - condition: trigger
          id: bootstrap
        - condition: and
          conditions:
          - condition: state
            entity_id: person.kjell
            state: not_home
            for:
              minutes: 2
          - condition: state
            entity_id: person.bettan
            state: not_home
            for:
              minutes: 2
      sequence:
      - action: mqtt.publish
        data:
          topic: home/state/home_away
          payload: away
          retain: true
          qos: 2
        continue_on_error: true
      - if:
        - condition: trigger
          id: presence
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.mqtt_home_alarm_state
          continue_on_error: true
  mode: restart
- id: '1783822800000'
  alias: Heartbeat & watchdog
  description: Publicerar timestamp varje minut och varnar om övriga HA är tysta i
    mer än 10 minuter, endast under de första 4 timmarna (ca 1 gång/timme). MQTT-fel
    stoppar inte watchdog-kontrollen.
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: timestamp/ha-server
      payload: '{{ as_timestamp(now()) | timestamp_local }}'
      retain: true
      qos: 2
    continue_on_error: true
  - variables:
      hosts:
      - entity: sensor.mqtt_kottbo_timestamp
        name: ha-kottbo
      - entity: sensor.mqtt_front_timestamp
        name: ha-front
      - entity: sensor.mqtt_core_timestamp
        name: ha-core
      - entity: sensor.mqtt_server_timestamp
        name: ha-server
  - repeat:
      for_each: '{{ hosts }}'
      sequence:
      - if:
        - condition: template
          value_template: "{% set s = states(repeat.item.entity) %} {% if s in [\"unknown\",
            \"unavailable\", \"none\", \"\"] %}\n  {% set age = as_timestamp(now())\n
            \   - as_timestamp(states[repeat.item.entity].last_changed) %}\n  {{ age
            < 14400 and now().minute == 0 }}\n{% else %}\n  {% set age = as_timestamp(now())
            - as_timestamp(s) %}\n  {{ age >= 600 and age < 14400 and (age // 60)
            % 60 == 10 }}\n{% endif %}"
        then:
        - action: script.send_user_message
          data:
            target: local
            telegram: true
            message: "{% set s = states(repeat.item.entity) %} {% if s in [\"unknown\",
              \"unavailable\", \"none\", \"\"] %}\n  Varning! {{ repeat.item.name
              }} har ingen heartbeat-timestamp.\n{% else %}\n  {% set age = (as_timestamp(now())
              - as_timestamp(s)) | int %}\n  {% set h = age // 3600 %}\n  {% set m
              = (age % 3600) // 60 %}\n  Varning! {{ repeat.item.name }} har inte
              skickat heartbeat på\n  {%- if h > 0 %} {{ h }}h{% endif %} {{ m }}m.\n{%
              endif %}"
          continue_on_error: true
  mode: single
  max_exceeded: silent

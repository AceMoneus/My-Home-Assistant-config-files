- id: '1754568986656'
  alias: Tänd lampor vid rörelse om det är mörkt
  description: mt29 lyktstolpe → mt57+mt54; mt50 garagehörn → mt57+mt54+mt56; mt52
    förråd → mt56; mt49 vedbod → mt55+mt56. Släcks efter 2 min.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.mt29_belaggning
    - binary_sensor.mt49_belaggning
    - binary_sensor.mt50_belaggning
    - binary_sensor.mt52_belaggning
    to: 'on'
  conditions:
  - condition: state
    entity_id: binary_sensor.mqtt_home_dark
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''binary_sensor.mt29_belaggning''
          }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.mt57
          - light.mt54
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''binary_sensor.mt50_belaggning''
          }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.mt57
          - light.mt54
          - light.mt56
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''binary_sensor.mt52_belaggning''
          }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.mt56
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''binary_sensor.mt49_belaggning''
          }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.mt55
          - light.mt56
  - delay:
      minutes: 2
  - action: light.turn_off
    target:
      entity_id:
      - light.mt54
      - light.mt55
      - light.mt56
      - light.mt57
  mode: restart
- id: '1754981360756'
  alias: Släck alla lampor när det blir ljust
  description: Släcker vid lux över 15 efter soluppgång, alltid 30 min efter soluppgång
  triggers:
  - trigger: numeric_state
    entity_id: sensor.mt29_belysningsstyrka
    above: 15
    id: lux_above_15
  - trigger: sun
    event: sunrise
    offset: 00:30:00
    id: sunrise_plus_30
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: sunrise_plus_30
    - condition: and
      conditions:
      - condition: trigger
        id: lux_above_15
      - condition: sun
        after: sunrise
  actions:
  - action: homeassistant.turn_off
    target:
      entity_id:
      - switch.mqtt_home_morning_lights
      - switch.mqtt_home_evening_lights
      - switch.mqtt_home_bedroom_light
      - switch.mqtt_home_outside_mood_lights
      - switch.mqtt_home_outside_lighting
    continue_on_error: true
  mode: restart

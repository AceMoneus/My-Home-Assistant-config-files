- id: '1762602864883'
  alias: mqtt_outside_mood_lights
  description: Utemyslampor via group.outdoor_mood_lights — hoppar unavailable, continue_on_error
  triggers:
  - entity_id:
    - switch.mqtt_home_outside_mood_lights
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.mqtt_home_outside_mood_lights
        state:
        - 'on'
      sequence:
      - variables:
          targets: '{{ expand(''group.outdoor_mood_lights'') | rejectattr(''state'',
            ''eq'', ''unavailable'') | map(attribute=''entity_id'') | list }}'
      - if:
        - '{{ targets | count > 0 }}'
        then:
        - action: homeassistant.turn_on
          target:
            entity_id: '{{ targets }}'
          continue_on_error: true
    - conditions:
      - condition: state
        state:
        - 'off'
        entity_id: switch.mqtt_home_outside_mood_lights
      sequence:
      - variables:
          targets: '{{ expand(''group.outdoor_mood_lights'') | rejectattr(''state'',
            ''eq'', ''unavailable'') | map(attribute=''entity_id'') | list }}'
      - if:
        - '{{ targets | count > 0 }}'
        then:
        - action: homeassistant.turn_off
          target:
            entity_id: '{{ targets }}'
          continue_on_error: true
  mode: restart
- id: '1762609393709'
  alias: Tänd lampor när det blir mörkt
  description: Tänder vid solnedgång eller när lux går under 15 inom 30 min före solnedgång
  triggers:
  - trigger: sun
    event: sunset
    id: sunset
  - trigger: numeric_state
    entity_id: sensor.mt29_belysningsstyrka
    below: 15
    id: low_lux
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: sunset
    - condition: and
      conditions:
      - condition: trigger
        id: low_lux
      - condition: sun
        after: sunset
        after_offset: -00:30:00
      - condition: sun
        before: sunset
  actions:
  - action: homeassistant.turn_on
    target:
      entity_id:
      - switch.mqtt_home_evening_lights
      - switch.mqtt_home_bedroom_light
      - switch.mqtt_home_morning_lights
      - switch.mqtt_home_outside_mood_lights
    continue_on_error: true
  mode: restart

  - variables:
      down: "{% set cutoff = now() - timedelta(hours=1) %}\n{% set ns = namespace(seen=[],
        down=[], stale=[]) %}\n{% for eid in integration_entities('matter') %}\n  {%
        set name = device_attr(eid, 'name_by_user') %}\n  {% if name and name not
        in ns.seen %}\n    {% set ns.seen = ns.seen + [name] %}\n    {% set own =
        device_entities(device_id(eid)) %}\n    {% set up = namespace(ok=false, latest=none)
        %}\n    {% for e in own %}\n      {% if states(e) not in ['unavailable', 'unknown']
        %}\n        {% set up.ok = true %}\n      {% elif is_state(e, 'unavailable')
        and states[e] is not none %}\n        {% if up.latest is none or states[e].last_changed
        > up.latest %}\n          {% set up.latest = states[e].last_changed %}\n        {%
        endif %}\n      {% endif %}\n    {% endfor %}\n    {% if not up.ok and up.latest
        %}\n      {% set ns.down = ns.down + [name] %}\n      {% if up.latest < cutoff
        %}\n        {% set ns.stale = ns.stale + [name] %}\n      {% endif %}\n    {%
        endif %}\n  {% endif %}\n{% endfor %}\n{{- ns.down | sort | join(',') -}}||{{-
        ns.stale | sort | join(',') -}}\n"
      down_names: '{{ (down | trim).split(''||'')[0] }}'
      stale_names: '{{ (down | trim).split(''||'')[1] }}'
      previous: '{{ states(''input_text.matter_enhet_notifierat'') }}'
      new_names: "{% if previous == '*' %}\n{% elif (stale_names | length) > 240 %}\n
        \ *\n{% else %}\n  {% set old = previous.split(',') | reject('equalto', '')
        | reject('equalto', 'unknown') | list %}\n  {% set cur = stale_names.split(',')
        | reject('equalto', '') | list %}\n  {{- cur | reject('in', old) | list |
        join(', ') -}}\n{% endif %}\n"
      remembered: "{% if (stale_names | length) > 240 %}\n  *\n{% else %}\n  {% set
        old = [] if previous in ['*', 'unknown', '', 'none'] else previous.split(',')
        %}\n  {% set still = down_names.split(',') | reject('equalto', '') | list
        %}\n  {% set cur = stale_names.split(',') | reject('equalto', '') | list %}\n
        \ {{- (old | select('in', still) | list + cur) | unique | reject('equalto',
        '') | sort | join(',') -}}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ new_names | trim == ''*'' }}'
      sequence:
      - action: script.send_user_message
        data:
          target: kjell
          telegram: true
          message: Alla Matter-enheter borta minst 1 h
    - conditions:
      - condition: template
        value_template: '{{ new_names | trim != '''' }}'
      sequence:
      - action: script.send_user_message
        data:
          target: kjell
          telegram: true
          message: 'Matter borta minst 1 h: {{ new_names | trim }}'
  - condition: template
    value_template: '{{ remembered | trim != previous }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.matter_enhet_notifierat
    data:
      value: '{{ remembered | trim }}'
  mode: single
- id: '1790593189359'
  alias: PostgreSQL Recorder payload
  description: Bygger PostgreSQL-payload från Recorder
  triggers:
  - trigger: time_pattern
    minutes: '1'
  actions:
  - action: recorder.get_statistics
    data:
      statistic_ids:
      - sensor.mt71_temperatur
      - sensor.mt71_luftfuktighet
      - sensor.mt72_temperatur
      - sensor.mt72_luftfuktighet
      - sensor.mt73_temperatur
      - sensor.mt73_luftfuktighet
      - sensor.mt74_temperatur
      - sensor.mt74_luftfuktighet
      - sensor.slimmelezer_momentary_active_import
      - sensor.slimmelezer_momentary_active_import_phase_1
      - sensor.slimmelezer_momentary_active_import_phase_2
      - sensor.slimmelezer_momentary_active_import_phase_3
      start_time: '{{ start_time }}'
      end_time: '{{ end_time }}'
      period: hour
      types:
      - mean
      - min
      - max
    response_variable: recorder_stats
  - action: recorder.get_statistics
    data:
      statistic_ids:
      - sensor.slimmelezer_cumulative_active_import
      start_time: '{{ start_time }}'
      end_time: '{{ end_time }}'
      period: hour
      types:
      - change
      - state
    response_variable: energy_stats
  - variables:
      payload: "{% set ns = namespace(rows=[], ts=none) %} {% set stats = recorder_stats.statistics
        | default({}) %}\n{% for m in metrics %}\n  {% set periods = stats.get(m.entity,
        []) %}\n\n  {% if periods | count > 0 %}\n    {% set p = periods[0] %}\n    {%
        set value = p.get(m.field) %}\n\n    {% if value is not none %}\n      {%
        set scale = m.scale | default(1) %}\n      {% set num = (value * scale) |
        round(m.round) %}\n\n      {% if ns.ts is none %}\n        {% set ns.ts =
        as_timestamp(p.start) | int %}\n      {% endif %}\n\n      {% set ns.rows
        = ns.rows + [{\n        'metric': m.tag,\n        'value': num,\n        'unit':
        m.unit,\n        'device_class': m.device_class,\n        'state_class': m.state_class\n
        \     }] %}\n    {% endif %}\n  {% endif %}\n{% endfor %} {% set energy =
        energy_stats.statistics.get(\n  'sensor.slimmelezer_cumulative_active_import',
        []\n) %}\n{% if energy | count > 0 %}\n  {% set e = energy[0] %}\n\n  {% if
        e.change is defined and e.change is not none %}\n    {% set ns.rows = ns.rows
        + [{\n      'metric': 'energy_imported',\n      'value': e.change | float
        | round(3),\n      'unit': 'kWh',\n      'device_class': 'energy',\n      'state_class':
        'total'\n    }] %}\n  {% endif %}\n\n  {% if e.state is defined and e.state
        is not none %}\n    {% set ns.rows = ns.rows + [{\n      'metric': 'energy_imported_total',\n
        \     'value': e.state | float | round(3),\n      'unit': 'kWh',\n      'device_class':
        'energy',\n      'state_class': 'total_increasing'\n    }] %}\n  {% endif
        %}\n{% endif %}\n{{ {\n  'site': 'ha-server',\n  'time': ns.ts,\n  'rows':
        ns.rows\n} | to_json }}"
  - action: shell_command.pg_telemetry_write
    data:
      payload_b64: '{{ payload | to_json | base64_encode }}'
    response_variable: pg_response
  mode: single
  variables:
    start_time: "{{ (now().replace(minute=0, second=0, microsecond=0) -\n    timedelta(hours=1)).isoformat()
      }}"
    end_time: '{{ now().replace(minute=0, second=0, microsecond=0).isoformat() }}'
    metrics:
    - entity: sensor.mt71_temperatur
      tag: temperature_inhouse
      field: mean
      unit: °C
      round: 1
      device_class: temperature
      state_class: measurement
    - entity: sensor.mt71_luftfuktighet
      tag: humidity_inhouse
      field: mean
      unit: '%'
      round: 0
      device_class: humidity
      state_class: measurement
    - entity: sensor.mt72_temperatur
      tag: temperature_outside
      field: mean
      unit: °C
      round: 1
      device_class: temperature
      state_class: measurement
    - entity: sensor.mt72_luftfuktighet
      tag: humidity_outside
      field: mean
      unit: '%'
      round: 0
      device_class: humidity
      state_class: measurement
    - entity: sensor.mt73_temperatur
      tag: basement_temperature
      field: mean
      unit: °C
      round: 1
      device_class: temperature
      state_class: measurement
    - entity: sensor.mt73_luftfuktighet
      tag: basement_humidity
      field: mean
      unit: '%'
      round: 0
      device_class: humidity
      state_class: measurement
    - entity: sensor.mt74_temperatur
      tag: bedroom_temperature
      field: mean
      unit: °C
      round: 1
      device_class: temperature
      state_class: measurement
    - entity: sensor.mt74_luftfuktighet
      tag: bedroom_humidity
      field: mean
      unit: '%'
      round: 0
      device_class: humidity
      state_class: measurement
    - entity: sensor.slimmelezer_momentary_active_import
      tag: total_power_mean
      field: mean
      unit: W
      round: 0
      scale: 1000
      device_class: power
      state_class: measurement
    - entity: sensor.slimmelezer_momentary_active_import
      tag: total_power_min
      field: min
      unit: W
      round: 0
      scale: 1000
      device_class: power
      state_class: measurement
    - entity: sensor.slimmelezer_momentary_active_import
      tag: total_power_max
      field: max
      unit: W
      round: 0
      scale: 1000
      device_class: power
      state_class: measurement
    - entity: sensor.slimmelezer_momentary_active_import_phase_1
      tag: power_l1_mean
      field: mean
      unit: W
      round: 0

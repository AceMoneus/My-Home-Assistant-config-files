- id: '1738673008459'
  alias: HA Boot & Shutdown
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
    id: started
  - trigger: homeassistant
    event: shutdown
    id: shutdown
  conditions: []
  actions:
  - action: script.send_user_message
    data:
      target: local
      telegram: false
      message: '{{ trigger.id }}'
  mode: single
- id: '1738679737175'
  alias: Alarm Home - Turn ON
  description: Aktiverar larm endast vid off → on
  triggers:
  - trigger: state
    entity_id: switch.mqtt_home_alarm_state
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: script.send_user_message
    data:
      target: both
      telegram: true
      message: "{% if is_state('binary_sensor.mt30_dorr', 'on')\n    or is_state('binary_sensor.mt32_dorr',
        'on')\n    or is_state('binary_sensor.mt68_dorr', 'on')\n    or is_state('binary_sensor.mt69_dorr',
        'on') %}\n  Larm PÅ - Dörr/fönster öppet\n{% else %}\n  Larm PÅ\n{% endif
        %}"
  - action: switch.turn_on
    continue_on_error: true
    target:
      entity_id:
      - switch.mt4
      - switch.mt8
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.mt18
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.fresh_ovre_badrum_constant_speed
    data: {}
  - delay:
      minutes: 1
  - action: switch.turn_on
    continue_on_error: true
    target:
      entity_id:
      - switch.security_hall_detektioner_person
      - switch.g5_flex_detektioner_person_2
      - switch.kok_detections_person
      - switch.uppfart_detektioner_person
      - switch.security_ytterdorr_detektioner_person
      - switch.koksdorr_detektioner_person
      - switch.g4_instant_detektioner_person
  mode: restart
- id: '1738679758106'
  alias: Alarm Home - Turn OFF
  description: Avaktiverar larm endast vid on → off
  triggers:
  - trigger: state
    entity_id: switch.mqtt_home_alarm_state
    from: 'on'
    to: 'off'
  conditions: []
  actions:
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id:
      - switch.security_hall_detektioner_person
      - switch.g5_flex_detektioner_person_2
      - switch.kok_detections_person
      - switch.uppfart_detektioner_person
      - switch.security_ytterdorr_detektioner_person
      - switch.koksdorr_detektioner_person
      - switch.g4_instant_detektioner_person
  - action: switch.turn_on
    continue_on_error: true
    target:
      entity_id: switch.mt18
  - action: script.send_user_message
    data:
      target: both
      telegram: true
      message: Larm AV
  - if:
    - condition: time
      after: 06:00:00
      before: '22:00:00'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.fresh_ovre_badrum_constant_speed
  - delay:
      seconds: 10
  - action: switch.turn_off
    continue_on_error: true
    target:
      entity_id:
      - switch.mt4
      - switch.mt8
  mode: restart
- id: '1741249838102'
  alias: MQTT - klimat publish
  description: Publicerar mt71–mt74 temp/fukt till MQTT (home/temp|humid/*).
  triggers:
  - trigger: state
    entity_id:
    - sensor.mt71_temperatur
    - sensor.mt71_luftfuktighet
    - sensor.mt72_temperatur
    - sensor.mt72_luftfuktighet
    - sensor.mt73_temperatur
    - sensor.mt73_luftfuktighet
    - sensor.mt74_temperatur
    - sensor.mt74_luftfuktighet
  actions:
  - variables:
      loc: "{% set m = {\n  'sensor.mt71_temperatur': 'inhouse',\n  'sensor.mt71_luftfuktighet':
        'inhouse',\n  'sensor.mt72_temperatur': 'outside',\n  'sensor.mt72_luftfuktighet':
        'outside',\n  'sensor.mt73_temperatur': 'basement',\n  'sensor.mt73_luftfuktighet':
        'basement',\n  'sensor.mt74_temperatur': 'bedroom',\n  'sensor.mt74_luftfuktighet':
        'bedroom'\n} %} {{ m.get(trigger.entity_id, '') }}"
      temp_entity: "{% set m = {\n  'inhouse': 'sensor.mt71_temperatur',\n  'outside':
        'sensor.mt72_temperatur',\n  'basement': 'sensor.mt73_temperatur',\n  'bedroom':
        'sensor.mt74_temperatur'\n} %} {{ m.get(loc, '') }}"
      humid_entity: "{% set m = {\n  'inhouse': 'sensor.mt71_luftfuktighet',\n  'outside':
        'sensor.mt72_luftfuktighet',\n  'basement': 'sensor.mt73_luftfuktighet',\n
        \ 'bedroom': 'sensor.mt74_luftfuktighet'\n} %} {{ m.get(loc, '') }}"
  - condition: template
    value_template: '{{ loc | length > 0 }}'
  - action: mqtt.publish
    data:
      topic: home/temp/{{ loc }}
      payload: '{{ states(temp_entity) }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: home/humid/{{ loc }}
      payload: '{{ states(humid_entity) }}'
      retain: true
  mode: queued

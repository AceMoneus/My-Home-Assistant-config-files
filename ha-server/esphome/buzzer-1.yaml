substitutions:
  device_name: c3-buzzer-1
  friendly_name: "C3 Buzzer 1"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

packages:
  common: !include common/common.yaml

globals:
  - id: fw_version
    type: std::string
    restore_value: no
    initial_value: '"v1.0"'

output:
  - platform: ledc
    pin: GPIO8
    id: buzzer_out
    inverted: true

rtttl:
  id: buzzer_rtttl
  output: buzzer_out
  gain: 70%

button:
  - platform: template
    name: "Buzzer beep"
    icon: "mdi:bell-ring"
    on_press:
      - rtttl.play: "beep:d=8,o=5,b=120:c6,e6,g6"
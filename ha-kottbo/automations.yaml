- id: '1790255414306'
  alias: Zigbee-enhet borta
  description: 'Meddelar Kjell en gång per avbrott när en Zigbee-enhet varit unavailable
    i minst en timme. Klockan sparas i hjälparen så att en omstart inte nollställer
    den.

    '
  triggers:
  - trigger: time_pattern
    minutes: /15
  conditions: []
  actions:
  - variables:
      previous: '{{ states(''input_text.zigbee_enhet_notifierat'') }}'
      tracked: "{% set clock = namespace(items={}) %}\n{% set noted = namespace(items=[])
        %}\n{% if previous not in ['', 'unknown', 'none', 'unavailable', '*'] %}\n
        \ {% for item in previous.split(',') %}\n    {% if item.startswith('!') %}\n
        \     {% set noted.items = noted.items + [item[1:]] %}\n    {% elif '|' in
        item %}\n      {% set bits = item.split('|', 1) %}\n      {% set clock.items
        = dict(clock.items, **{bits[0]: bits[1] | int(0)}) %}\n    {% elif item %}\n
        \     {% set noted.items = noted.items + [item] %}\n    {% endif %}\n  {%
        endfor %}\n{% endif %}\n{% set ns = namespace(seen=[], rows=[]) %}\n{% for
        eid in integration_entities('zha') %}\n  {% set name = device_attr(eid, 'name_by_user')
        %}\n  {% if name and ',' not in name and '|' not in name and '!' not in name
        and name not in ns.seen %}\n    {% set ns.seen = ns.seen + [name] %}\n    {%
        set own = device_entities(device_id(eid)) %}\n    {% set up = namespace(ok=false,
        latest=none) %}\n    {% for e in own %}\n      {% if states(e) not in ['unavailable',
        'unknown'] %}\n        {% set up.ok = true %}\n      {% elif is_state(e, 'unavailable')
        and states[e] is not none %}\n        {% if up.latest is none or states[e].last_changed
        > up.latest %}\n          {% set up.latest = states[e].last_changed %}\n        {%
        endif %}\n      {% endif %}\n    {% endfor %}\n    {% if not up.ok and up.latest
        %}\n      {% if name in clock.items %}\n        {% set epoch = clock.items[name]
        %}\n      {% else %}\n        {% set epoch = as_timestamp(up.latest) | int
        %}\n      {% endif %}\n      {% set ns.rows = ns.rows + [name ~ '|' ~ epoch
        ~ '|' ~ (1 if name in noted.items else 0)] %}\n    {% endif %}\n  {% endif
        %}\n{% endfor %}\n{{- ns.rows | sort | join(',') -}}\n"
      new_names: "{% if previous == '*' %}\n{% elif (tracked | length) > 240 %}\n
        \ *\n{% else %}\n  {% set cutoff = (as_timestamp(now()) - 3600) | int %}\n
        \ {% set fresh = namespace(items=[]) %}\n  {% for row in tracked.split(',')
        | reject('equalto', '') %}\n    {% set bits = row.split('|') %}\n    {% if
        bits | length == 3 and bits[2] == '0' and (bits[1] | int(0)) < cutoff %}\n
        \     {% set fresh.items = fresh.items + [bits[0]] %}\n    {% endif %}\n  {%
        endfor %}\n  {{- fresh.items | sort | join(', ') -}}\n{% endif %}\n"
      remembered: "{% if (tracked | length) > 240 %}\n  *\n{% else %}\n  {% set cutoff
        = (as_timestamp(now()) - 3600) | int %}\n  {% set out = namespace(items=[])
        %}\n  {% for row in tracked.split(',') | reject('equalto', '') %}\n    {%
        set bits = row.split('|') %}\n    {% if bits | length == 3 %}\n      {% if
        bits[2] == '1' or (bits[1] | int(0)) < cutoff %}\n        {% set out.items
        = out.items + ['!' ~ bits[0]] %}\n      {% else %}\n        {% set out.items
        = out.items + [bits[0] ~ '|' ~ bits[1]] %}\n      {% endif %}\n    {% endif
        %}\n  {% endfor %}\n  {{- out.items | sort | join(',') -}}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ new_names | trim == ''*'' }}'
      sequence:
      - action: script.send_user_message
        data:
          target: kjell
          telegram: true
          message: Alla Zigbee-enheter borta minst 1 h
    - conditions:
      - condition: template
        value_template: '{{ new_names | trim != '''' }}'
      sequence:
      - action: script.send_user_message
        data:
          target: kjell
          telegram: true
          message: 'Zigbee borta minst 1 h: {{ new_names | trim }}'
  - condition: template
    value_template: '{{ remembered | trim != previous }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.zigbee_enhet_notifierat
    data:
      value: '{{ remembered | trim }}'
  mode: single
- id: '1790338537495'
  alias: PostgreSQL – timvis export
  description: Batch JSON till lokal Postgres ha-metrics.telemetry varje XX:01 via
    shell_command.pg_telemetry_write. Effekt är redan i W, ingen kW-skalning.
  triggers:
  - trigger: time_pattern
    minutes: '1'
  actions:
  - variables:
      payload: "{% set ns = namespace(rows=[]) -%}\n{% for m in metrics -%}\n  {%
        set src = m.source -%}\n  {% set st = states(src) -%}\n  {% set lu = states[src].last_updated
        if states[src] is defined else none -%}\n  {% set age = (as_timestamp(now())
        - as_timestamp(lu)) / 60 if lu else 99999 -%}\n  {% set fresh = st not in
        ['unknown', 'unavailable', 'none', ''] and age <= m.max_age_min -%}\n  {%
        if fresh -%}\n    {% if m.energy_last_period | default(false) -%}\n      {%
        set val = state_attr(m.stats, 'last_period') -%}\n    {% else -%}\n      {%
        set val = states(m.stats) -%}\n    {% endif -%}\n    {% if val not in ['unknown',
        'unavailable', 'none', '', none] -%}\n      {% set raw = val | float -%}\n
        \     {% set num = ((raw * 1000) if m.scale_kw | default(false) else raw)
        | round(m.round) -%}\n      {% set ns.rows = ns.rows + [{'metric': m.tag,
        'value': num, 'unit': m.meas, 'device_class': m.device_class, 'state_class':
        m.state_class}] -%}\n    {% endif -%}\n  {% endif -%}\n{% endfor -%}\n{{ {'site':
        'ha-kottbo', 'time': ts, 'rows': ns.rows} | to_json }}"
  - if:
    - condition: template
      value_template: '{{ payload.rows | count > 0 }}'
    then:
    - action: shell_command.pg_telemetry_write
      data:
        payload_b64: '{{ payload | to_json | base64_encode }}'
      response_variable: pg_response
    - if:
      - condition: template
        value_template: '{{ pg_response[''returncode''] | default(1) != 0 }}'
      then:
      - action: script.send_user_message
        data:
          target: kjell
          telegram: true
          message: 'Postgres telemetry export misslyckades (rc={{ pg_response[''returncode'']
            | default(''?'') }}): {{ pg_response[''stderr''] | default(pg_response[''stdout'']
            | default('''')) | truncate(200) }}'
  mode: single
  variables:
    ts: '{{ as_timestamp(now().replace(minute=0, second=0, microsecond=0) - timedelta(hours=1))
      | int }}'
    metrics:
    - tag: temperature_inhouse
      source: sensor.temp_kitchen_temperature
      stats: sensor.postgresql_stats_temperature_inhouse
      meas: °C
      round: 1
      max_age_min: 180
      device_class: temperature
      state_class: measurement
    - tag: humidity_inhouse

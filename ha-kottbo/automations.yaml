    mer än 10 minuter (max ca 1 gång/timme)
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: timestamp/ha-kottbo
      payload: '{{ as_timestamp(now()) | timestamp_local }}'
      retain: true
      qos: 2
  - variables:
      hosts:
      - entity: sensor.mqtt_kottbo_timestamp
        name: ha-kottbo
      - entity: sensor.mqtt_front_timestamp
        name: ha-front
      - entity: sensor.mqtt_core_timestamp
        name: ha-core
      - entity: sensor.mqtt_server_timestamp
        name: ha-server
  - repeat:

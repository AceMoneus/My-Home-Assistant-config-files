    mer än 10 minuter (max ca 1 gång/timme)
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: timestamp/ha-kottbo
      payload: '{{ as_timestamp(now()) | timestamp_local }}'
      retain: true
      qos: 2
  - variables:
      hosts:
      - entity: sensor.mqtt_kottbo_timestamp
        name: ha-kottbo
      - entity: sensor.mqtt_front_timestamp
        name: ha-front
      - entity: sensor.mqtt_core_timestamp
        name: ha-core
      - entity: sensor.mqtt_server_timestamp
        name: ha-server
  - repeat:
      for_each: '{{ hosts }}'
      sequence:
      - if:
        - condition: template
          value_template: "{% set s = states(repeat.item.entity) %} {% if s in [\"unknown\",
            \"unavailable\", \"none\", \"\"] %}\n  {{ now().minute == 0 }}\n{% else
            %}\n  {% set age = as_timestamp(now()) - as_timestamp(s) %}\n  {{ age
            >= 600 and (age // 60) % 60 == 10 }}\n{% endif %}"
        then:
        - action: script.send_user_message
          data:
            target: local
            telegram: true
            message: 'Varning! {{ repeat.item.name }} senaste heartbeat: {{ states(repeat.item.entity)
              }}'
  mode: single
- id: '1787910064116'
  alias: MQTT - Kottbo home_away publish
  description: Publicerar kottbo/state/home_away (home|away, retain, qos 2) baserat
    på zone.home (personer i Kottbo). Bootstrap vid start och var 5:e minut. Styr
    larm endast vid närvarobyte.
  triggers:
  - trigger: state
    id: presence
    entity_id:
    - zone.home
  - trigger: homeassistant
    id: bootstrap
    event: start
  - trigger: time_pattern
    id: bootstrap
    minutes: /5
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      sequence:
      - action: mqtt.publish
        data:
          topic: kottbo/state/home_away
          payload: home
          retain: true
          qos: 2
        continue_on_error: true
      - if:
        - condition: trigger
          id: presence
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.mqtt_kottbo_alarm_state
          continue_on_error: true
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: zone.home
          state: '0'
        - condition: numeric_state
          entity_id: zone.home
          below: 1
      sequence:
      - action: mqtt.publish
        data:
          topic: kottbo/state/home_away
          payload: away
          retain: true
          qos: 2
        continue_on_error: true
      - if:
        - condition: trigger
          id: presence
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.mqtt_kottbo_alarm_state
          continue_on_error: true
  mode: restart

- id: '1787910064116'
  alias: MQTT - Kottbo home_away publish
  description: Publicerar kottbo/state/home_away (home|away, retain, qos 2) baserat
    på zone.home (personer i Kottbo). Bootstrap vid start och var 5:e minut. Styr
    larm endast vid närvarobyte.
  triggers:
  - trigger: state
    id: presence
    entity_id:
    - zone.home
  - trigger: homeassistant
    id: bootstrap
    event: start
  - trigger: time_pattern
    id: bootstrap
    minutes: /5
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      sequence:
      - action: mqtt.publish
        data:
          topic: kottbo/state/home_away
          payload: home
          retain: true
          qos: 2
        continue_on_error: true
      - if:
        - condition: trigger
          id: presence
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.mqtt_kottbo_alarm_state
          continue_on_error: true
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: zone.home
          state: '0'
        - condition: numeric_state
          entity_id: zone.home
          below: 1
      sequence:
      - action: mqtt.publish
        data:
          topic: kottbo/state/home_away
          payload: away
          retain: true
          qos: 2
        continue_on_error: true
      - if:
        - condition: trigger
          id: presence
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.mqtt_kottbo_alarm_state
          continue_on_error: true
  mode: restart

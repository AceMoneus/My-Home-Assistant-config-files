            \"unavailable\", \"none\", \"\"] %}\n  {{ now().minute == 0 }}\n{% else
            %}\n  {% set age = as_timestamp(now()) - as_timestamp(s) %}\n  {{ age
            >= 600 and (age // 60) % 60 == 10 }}\n{% endif %}"
        then:

- sensor:
    - name: "day_date"
      unique_id: day_date
      state: >-
        {{ as_timestamp(states('sensor.date_time_iso')) | timestamp_custom('%d %a') }}
      icon: "mdi:calendar-clock"

    - name: "sun_angle"
      unique_id: sun_angle
      state: "{{ state_attr('sun.sun', 'elevation') | round(1) }}"
      attributes:
        azimuth: "{{ state_attr('sun.sun', 'azimuth') | round(1) }}"

- binary_sensor:
    - name: "Larm home"
      unique_id: mqtt_home_alarm_state
      default_entity_id: binary_sensor.mqtt_home_alarm_state
      icon: "{{ 'mdi:shield-home' if is_state('switch.mqtt_home_alarm_state', 'on') else 'mdi:shield-off' }}"
      state: "{{ is_state('switch.mqtt_home_alarm_state', 'on') }}"

    - name: "Skalskydd"
      unique_id: mqtt_home_perimeter_protection
      default_entity_id: binary_sensor.mqtt_home_perimeter_protection
      icon: "{{ 'mdi:shield-moon' if is_state('switch.mqtt_home_perimeter_protection', 'on') else 'mdi:shield-off' }}"
      state: "{{ is_state('switch.mqtt_home_perimeter_protection', 'on') }}"

    - name: "Larm Kottbo"
      unique_id: mqtt_kottbo_alarm_state
      default_entity_id: binary_sensor.mqtt_kottbo_alarm_state
      icon: "{{ 'mdi:shield-home' if is_state('switch.mqtt_kottbo_alarm_state', 'on') else 'mdi:shield-off' }}"
      state: "{{ is_state('switch.mqtt_kottbo_alarm_state', 'on') }}"

- id: '1783822800000'
  alias: Heartbeat & watchdog
  description: 'Publicerar timestamp varje minut och varnar om övriga HA är tysta
    i mer än 10 minuter, endast under de första 4 timmarna (ca 1 gång/timme)

    '
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: timestamp/ha-front
      payload: '{{ as_timestamp(now()) | timestamp_local }}'
      retain: true
      qos: 2
  - variables:
      hosts:
      - entity: sensor.mqtt_timestamp_ha_kottbo
        name: ha-kottbo
      - entity: sensor.mqtt_timestamp_ha_front
        name: ha-front
      - entity: sensor.mqtt_timestamp_ha_core
        name: ha-core
      - entity: sensor.mqtt_timestamp_ha_server
        name: ha-server
  - repeat:
      for_each: '{{ hosts }}'
      sequence:
      - if:
        - condition: template
          value_template: "{% set s = states(repeat.item.entity) %} {% if s in [\"unknown\",
            \"unavailable\", \"none\", \"\"] %}\n  {% set age = as_timestamp(now())\n
            \   - as_timestamp(states[repeat.item.entity].last_changed) %}\n  {{ age
            < 14400 and now().minute == 0 }}\n{% else %}\n  {% set age = as_timestamp(now())
            - as_timestamp(s) %}\n  {{ age >= 600 and age < 14400 and (age // 60)
            % 60 == 10 }}\n{% endif %}"
        then:
        - action: script.send_user_message
          data:
            target: local
            telegram: true
            message: "{% set s = states(repeat.item.entity) %} {% if s in [\"unknown\",
              \"unavailable\", \"none\", \"\"] %}\n  Varning! {{ repeat.item.name
              }} har ingen heartbeat-timestamp.\n{% else %}\n  {% set age = (as_timestamp(now())
              - as_timestamp(s)) | int %}\n  {% set h = age // 3600 %}\n  {% set m
              = (age % 3600) // 60 %}\n  Varning! {{ repeat.item.name }} har inte
              skickat heartbeat på\n  {%- if h > 0 %} {{ h }}h{% endif %} {{ m }}m.\n{%
              endif %}"
  mode: single

- id: '1761301123800'
  alias: Front Github Commit
  description: ''
  triggers:
  - at: 05:00:00
    trigger: time
  conditions: []
  actions:
  - action: shell_command.git_sync
    data: {}
    metadata: {}
  mode: single
- id: '1781637271521'
  alias: Handle incoming user message
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: quarry/message
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ data.target == ''kjell'' }}'
      sequence:
      - data:
          message: '{{ data.message }}'
        action: notify.mobile_app_kjellmobil
    - conditions:
      - condition: template
        value_template: '{{ data.target == ''bettan'' }}'
      sequence:
      - action: notify.mobile_app_sm_a236b
        data:
          message: '{{ data.message }}'
    - conditions:
      - condition: template
        value_template: '{{ data.target == ''both'' }}'
      sequence:
      - data:
          message: '{{ data.message }}'
        action: notify.mobile_app_kjellmobil
      - action: notify.mobile_app_sm_a236b
        data:
          message: '{{ data.message }}'
        enabled: true
  - if:
    - condition: template
      value_template: '{{ data.telegram | default(false) | bool }}'
    then:
    - data:
        message: '{{ data.message }}'
      action: telegram_bot.send_message
  - if:
    - condition: template
      value_template: '{{ trigger.payload is not none and trigger.payload != ''''
        }}'
    then:
    - data:
        topic: quarry/message
        payload: ''
        retain: true
      action: mqtt.publish
  mode: queued
  max: 10
  variables:
    data: '{{ trigger.payload_json | default({}) }}'
- id: '1756899840000'
  alias: Message server gate
  description: Rensar retained quarry/message och styr Handle incoming user message
    via switch.mqtt_front_message_server
  triggers:
  - trigger: state
    entity_id: switch.mqtt_front_message_server
    to:
    - 'on'
    - 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''on'' }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: quarry/message
          payload: ''
          retain: true
      - action: automation.turn_on
        target:
          entity_id: automation.handle_incoming_user_message
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''off'' }}'
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.handle_incoming_user_message
  mode: single

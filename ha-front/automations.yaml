    data: {}
    metadata: {}
  mode: single
- id: '1781637271521'
  alias: Handle incoming user message
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: quarry/message
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ data.target == ''kjell'' }}'
      sequence:
      - data:
          message: '{{ data.message }}'
        action: notify.mobile_app_kjellmobil
    - conditions:
      - condition: template
        value_template: '{{ data.target == ''bettan'' }}'
      sequence:
      - action: notify.mobile_app_sm_a236b
        data:
          message: '{{ data.message }}'
    - conditions:
      - condition: template
        value_template: '{{ data.target == ''both'' }}'
      sequence:
      - data:
          message: '{{ data.message }}'
        action: notify.mobile_app_kjellmobil
      - action: notify.mobile_app_sm_a236b
        data:
          message: '{{ data.message }}'
  - if:
    - condition: template
      value_template: '{{ data.telegram | default(false) | bool }}'
    then:
    - data:
        message: '{{ data.message }}'
      action: telegram_bot.send_message
  - if:
    - condition: template
      value_template: '{{ trigger.payload is not none and trigger.payload != ''''
        }}'
    then:
    - data:
        topic: quarry/message
        payload: ''
        retain: true
      action: mqtt.publish
  mode: queued
  max: 10
  variables:
    data: '{{ trigger.payload_json | default({}) }}'
